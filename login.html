<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АСУ РСО — Вход</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <div class="logo">АСУ РСО</div>
    <p>Автоматизированная система управления ресурсами системы образования</p>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="login">Вход</button>
    <button type="button" class="tab-btn" data-tab="register">Регистрация</button>
  </div>

  <form id="loginForm" class="auth-form active" autocomplete="on">
    <label><span>Логин</span>
      <input type="text" id="loginLogin" placeholder="Введите логин" required>
    </label>
    <label><span>Пароль</span>
      <input type="password" id="loginPassword" placeholder="Введите пароль" required>
    </label>
    <button type="submit" class="btn-primary">Войти</button>
    <p class="error" id="loginError"></p>
  </form>

  <form id="registerForm" class="auth-form" autocomplete="off">
    <label><span>ФИО</span>
      <input type="text" id="regName" placeholder="Иванов Иван Иванович" required>
    </label>
    <label><span>Логин</span>
      <input type="text" id="regLogin" placeholder="Латиница и цифры, от 3 символов" required>
    </label>
    <label><span>Пароль</span>
      <input type="password" id="regPassword" placeholder="Минимум 6 символов" required>
    </label>
    <label><span>Роль</span>
      <select id="regRole" required>
        <option value="student">Ученик</option>
        <option value="teacher">Учитель</option>
        <option value="admin">Администратор</option>
      </select>
    </label>
    <label id="classField" style="display:none;"><span>Класс</span>
      <select id="regClass"></select>
    </label>
    <label id="subjectsField" style="display:none;"><span>Предметы (через запятую)</span>
      <input type="text" id="regSubjects" placeholder="Алгебра, Геометрия">
    </label>
    <button type="submit" class="btn-primary">Зарегистрироваться</button>
    <p class="error" id="regError"></p>
  </form>
</div>

<!-- Скрипты в строгом порядке -->
<script src="js/storage.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
